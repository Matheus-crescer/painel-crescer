<style>
:root{
  color-scheme: light;
  --plano:#f9f9f7; --surface-1:#fcfcfb;
  --ink:#0b0b0b; --ink2:#52514e; --mudo:#898781;
  --grade:#e1e0d9; --base:#c3c2b7; --borda:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --critico:#d03b3b; --bom:#006300;
  --chip:rgba(11,11,11,.05); --chip-on:#2a78d6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plano:#0d0d0d; --surface-1:#1a1a19;
    --ink:#f0efec; --ink2:#c3c2b7; --mudo:#898781;
    --grade:#2c2c2a; --base:#383835; --borda:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --critico:#d03b3b; --bom:#0ca30c;
    --chip:rgba(255,255,255,.07); --chip-on:#3987e5;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plano:#0d0d0d; --surface-1:#1a1a19;
  --ink:#f0efec; --ink2:#c3c2b7; --mudo:#898781;
  --grade:#2c2c2a; --base:#383835; --borda:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --critico:#d03b3b; --bom:#0ca30c;
  --chip:rgba(255,255,255,.07); --chip-on:#3987e5;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--plano); color:var(--ink);
  font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
/* ---------- topo ---------- */
.topo{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:12px 16px 10px;flex-wrap:wrap}
.topo h1{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}
.topo .sub{color:var(--mudo);font-size:11.5px}
.espaco{flex:1 1 auto}
.chips{display:flex;gap:4px;background:var(--chip);padding:3px;border-radius:9px}
.chips button{
  font:inherit;font-size:12px;font-weight:550;color:var(--ink2);
  background:none;border:0;border-radius:6px;padding:5px 11px;cursor:pointer;
}
.chips button[aria-pressed="true"]{background:var(--surface-1);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips button:focus-visible{outline:2px solid var(--chip-on);outline-offset:1px}
.leg{display:flex;gap:12px;align-items:center;font-size:11.5px;color:var(--ink2)}
.leg i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
/* ---------- grade ---------- */
.grade{flex:1 1 auto;display:grid;gap:10px;grid-template-rows:auto minmax(170px,1fr) minmax(190px,1.15fr);padding:0 16px 14px;min-height:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.meio{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;min-height:0}
.card{background:var(--surface-1);border:1px solid var(--borda);border-radius:11px;padding:11px 13px;min-height:0;display:flex;flex-direction:column}
.card h2{margin:0 0 1px;font-size:12px;font-weight:600;color:var(--ink)}
.card .dica{margin:0 0 8px;font-size:11px;color:var(--mudo)}
/* ---------- kpi ---------- */
.kpi .rot{font-size:11px;font-weight:600;color:var(--mudo);text-transform:uppercase;letter-spacing:.04em}
.kpi .grande{font-size:26px;font-weight:620;letter-spacing:-.02em;margin:3px 0 1px;line-height:1.1}
.kpi .nota{font-size:11px;color:var(--ink2);margin-bottom:7px}
.kpi .quebra{display:grid;grid-template-columns:auto 1fr;gap:2px 7px;font-size:11.5px;color:var(--ink2);margin-top:auto}
.kpi .quebra b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.kpi .quebra span{white-space:nowrap}
.kpi.alerta .grande{color:var(--critico)}
.selo{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--critico)}
/* ---------- grafico ---------- */
.plot{flex:1 1 auto;min-height:0;position:relative}
.plot svg{display:block;width:100%;height:100%}
.gx,.gy{stroke:var(--grade);stroke-width:1}
.eixo{stroke:var(--base);stroke-width:1}
.tick{fill:var(--mudo);font-size:10.5px;font-variant-numeric:tabular-nums}
.rotbarra{fill:var(--ink2);font-size:11px}
.valbarra{fill:var(--ink2);font-size:10.5px;font-variant-numeric:tabular-nums}
.marcafim{font-size:11px;font-weight:600}
.cruz{stroke:var(--base);stroke-width:1;stroke-dasharray:3 3}
.tip{
  position:absolute;pointer-events:none;opacity:0;transition:opacity .09s;
  background:var(--surface-1);border:1px solid var(--borda);border-radius:8px;
  padding:7px 9px;font-size:11.5px;box-shadow:0 4px 14px rgba(0,0,0,.14);
  min-width:132px;z-index:5;
}
.tip .t{font-weight:600;margin-bottom:4px;font-size:11px;color:var(--ink2)}
.tip .l{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip .l b{font-variant-numeric:tabular-nums}
.tip i{width:8px;height:8px;border-radius:2px;display:inline-block}
/* ---------- tabela ---------- */
.rolar{overflow:auto;min-height:0;margin:0 -13px -11px;padding:0 13px 11px}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{
  position:sticky;top:0;background:var(--surface-1);z-index:1;
  text-align:left;font-size:10.5px;font-weight:600;color:var(--mudo);
  text-transform:uppercase;letter-spacing:.04em;padding:0 8px 6px;white-space:nowrap;
}
tbody td{padding:5px 8px;border-top:1px solid var(--grade);vertical-align:middle}
tbody tr:hover td{background:var(--chip)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sku{color:var(--mudo);font-variant-numeric:tabular-nums;font-size:11px}
.prod{max-width:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrinha{position:relative;height:5px;border-radius:3px;background:var(--chip);min-width:46px}
.barrinha i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--s1);display:block}
.pe{flex:0 0 auto;padding:0 16px 10px;font-size:10.5px;color:var(--mudo)}
/* ---------- telas estreitas ---------- */
@media (max-width:1040px){
  html,body{height:auto}
  body{display:block;overflow:auto}
  .grade{display:grid;height:auto;grid-template-rows:none;padding-bottom:18px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .meio{grid-template-columns:1fr}
  .plot{flex:0 0 auto;height:226px}
  .card{min-height:auto}
  .rolar{overflow:visible;max-height:none}
}
@media (max-width:560px){
  .topo{padding:12px 16px 8px}
  .grade{padding:0 16px 18px}
  .kpis{grid-template-columns:1fr}
  .kpi .grande{font-size:23px}
}
</style>

<script>
(function(){
  var SVG='http://www.w3.org/2000/svg';
  var el=function(t,a){var n=document.createElementNS(SVG,t);for(var k in a)n.setAttribute(k,a[k]);return n;};
  var css=function(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();};

  var brl=function(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2});};
  var brl0=function(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});};
  var pct=function(n){return (n*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';};
  var kk=function(n){return n>=1000?(n/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k':String(Math.round(n));};
  var dia=function(s){var p=s.split('-');return p[2]+'/'+p[1];};

  var atual='p90';

  /* ================= KPIs ================= */
  function kpis(d){
    var ml=d.kpi.ml, mv=d.kpi.mv;
    var fat=ml.fat+mv.fat, can=ml.can+mv.can, and=ml.and+mv.and;
    var bruto=fat+can+and;
    var nf=ml.nf+mv.nf, nc=ml.nc+mv.nc;
    var itens=ml.itens+mv.itens;
    var tk=nf?fat/nf:0, tkml=ml.nf?ml.fat/ml.nf:0, tkmv=mv.nf?mv.fat/mv.nf:0;

    var cartoes=[
      { rot:'Faturado', grande:brl0(fat), nota:nf+' pedidos · '+itens+' itens',
        linhas:[['Mercado Livre',brl0(ml.fat)],['Mevo',brl0(mv.fat)]] },
      { rot:'Cancelado', grande:brl0(can), alerta:true,
        selo:pct(bruto?can/bruto:0)+' do bruto · '+nc+' pedidos',
        linhas:[['Mercado Livre',brl0(ml.can)],['Mevo',brl0(mv.can)]] },
      { rot:'Pedidos faturados', grande:String(nf),
        nota:(and>0? brl0(and)+' ainda em andamento' : 'nada em andamento'),
        linhas:[['Mercado Livre',String(ml.nf)],['Mevo',String(mv.nf)]] },
      { rot:'Ticket médio', grande:brl(tk), nota:'faturado dividido por pedido',
        linhas:[['Mercado Livre',brl(tkml)],['Mevo',brl(tkmv)]] }
    ];

    var alvo=document.getElementById('kpis');
    alvo.textContent='';
    cartoes.forEach(function(c){
      var div=document.createElement('div');
      div.className='card kpi'+(c.alerta?' alerta':'');
      var h='<div class="rot">'+c.rot+'</div><div class="grande">'+c.grande+'</div>';
      if(c.selo){
        h+='<div class="nota"><span class="selo">'+
           '<svg width="11" height="11" viewBox="0 0 16 16" aria-hidden="true">'+
           '<path d="M8 1.6 15 14H1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>'+
           '<path d="M8 6v3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'+
           '<circle cx="8" cy="11.8" r=".9" fill="currentColor"/></svg>'+
           c.selo+'</span></div>';
      } else {
        h+='<div class="nota">'+c.nota+'</div>';
      }
      h+='<div class="quebra">';
      c.linhas.forEach(function(l,i){
        h+='<span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--s'+(i+1)+')"></i>'+l[0]+'</span><b>'+l[1]+'</b>';
      });
      h+='</div>';
      div.innerHTML=h;
      alvo.appendChild(div);
    });
  }

  /* ================= linha: por dia ================= */
  function porDia(d){
    var box=document.getElementById('plotDia'), tip=document.getElementById('tipDia');
    var W=box.clientWidth, H=box.clientHeight;
    if(W<40||H<40) return;
    Array.prototype.slice.call(box.querySelectorAll('svg')).forEach(function(s){s.remove();});

    var dados=d.dd, n=dados.length;
    var mL={t:14,r:46,b:22,l:46};
    var pw=W-mL.l-mL.r, ph=H-mL.t-mL.b;
    var max=0; dados.forEach(function(r){max=Math.max(max,r[1],r[2]);});
    max=max||1;
    var passo=Math.pow(10,Math.floor(Math.log10(max)));
    var topo=Math.ceil(max/passo*1.08)*passo;
    var x=function(i){return mL.l+(n<2?pw/2:i*pw/(n-1));};
    var y=function(v){return mL.t+ph-(v/topo)*ph;};

    var svg=el('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':'Faturamento por dia, Mercado Livre e Mevo'});

    var marcas=[0,topo/2,topo];
    marcas.forEach(function(v){
      svg.appendChild(el('line',{class:'gy',x1:mL.l,x2:mL.l+pw,y1:y(v),y2:y(v)}));
      var t=el('text',{class:'tick',x:mL.l-7,y:y(v)+3.5,'text-anchor':'end'});
      t.textContent=v===0?'0':kk(v); svg.appendChild(t);
    });
    svg.appendChild(el('line',{class:'eixo',x1:mL.l,x2:mL.l+pw,y1:y(0),y2:y(0)}));

    var cada=Math.max(1,Math.ceil(n/8));
    dados.forEach(function(r,i){
      if(i%cada && i!==n-1) return;
      var t=el('text',{class:'tick',x:x(i),y:H-6,'text-anchor':'middle'});
      t.textContent=dia(r[0]); svg.appendChild(t);
    });

    [1,2].forEach(function(s){
      var cor=css('--s'+s);
      var p=dados.map(function(r,i){return (i?'L':'M')+x(i)+' '+y(r[s]);}).join(' ');
      svg.appendChild(el('path',{d:p,fill:'none',stroke:cor,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
      var ult=null;
      for(var i=n-1;i>=0;i--){ if(dados[i][s]>0){ult=i;break;} }
      if(ult!==null){
        var vu=dados[ult][s];
        svg.appendChild(el('circle',{cx:x(ult),cy:y(vu),r:4,fill:cor,stroke:css('--surface-1'),'stroke-width':2}));
        /* rotulo direto so quando o ponto esta alto o bastante para nao colidir com o eixo */
        if(vu/topo>=0.08){
          var fim=x(ult)+9>W-52;
          /* afasta as duas series na vertical para os rotulos nao colidirem
             quando os ultimos pontos ficam perto um do outro */
          var dy=(s===1?-7:14);
          var lab=el('text',{class:'marcafim',x:fim?x(ult)-9:x(ult)+9,y:y(vu)+dy,fill:cor,'text-anchor':fim?'end':'start'});
          lab.textContent=brl0(vu); svg.appendChild(lab);
        }
      }
    });

    var cruz=el('line',{class:'cruz',y1:mL.t,y2:mL.t+ph,x1:-9,x2:-9});
    svg.appendChild(cruz);
    var pts=[el('circle',{r:4.5,fill:css('--s1'),stroke:css('--surface-1'),'stroke-width':2,opacity:0}),
             el('circle',{r:4.5,fill:css('--s2'),stroke:css('--surface-1'),'stroke-width':2,opacity:0})];
    pts.forEach(function(p){svg.appendChild(p);});

    svg.addEventListener('pointermove',function(ev){
      var cx=ev.clientX-box.getBoundingClientRect().left;
      var i=Math.max(0,Math.min(n-1,Math.round((cx-mL.l)/(pw/Math.max(1,n-1)))));
      var r=dados[i];
      cruz.setAttribute('x1',x(i)); cruz.setAttribute('x2',x(i));
      [1,2].forEach(function(s,k){
        pts[k].setAttribute('cx',x(i)); pts[k].setAttribute('cy',y(r[s])); pts[k].setAttribute('opacity',1);
      });
      tip.innerHTML='<div class="t">'+dia(r[0])+'</div>'+
        '<div class="l"><span><i style="background:var(--s1)"></i> Mercado Livre</span><b>'+brl0(r[1])+'</b></div>'+
        '<div class="l"><span><i style="background:var(--s2)"></i> Mevo</span><b>'+brl0(r[2])+'</b></div>';
      tip.style.opacity=1;
      var tw=tip.offsetWidth;
      tip.style.left=Math.max(2,Math.min(W-tw-2,x(i)-tw/2))+'px';
      tip.style.top=Math.max(2,Math.min(H-tip.offsetHeight-2,y(Math.max(r[1],r[2]))-tip.offsetHeight-10))+'px';
    });
    svg.addEventListener('pointerleave',function(){
      tip.style.opacity=0; cruz.setAttribute('x1',-9); cruz.setAttribute('x2',-9);
      pts.forEach(function(p){p.setAttribute('opacity',0);});
    });
    box.appendChild(svg);
  }

  /* ================= barras: por loja ================= */
  function porLoja(d){
    var box=document.getElementById('plotLoja'), tip=document.getElementById('tipLoja');
    var W=box.clientWidth, H=box.clientHeight;
    if(W<40||H<40) return;
    Array.prototype.slice.call(box.querySelectorAll('svg')).forEach(function(s){s.remove();});

    var dados=d.lj, n=dados.length;
    var rotW=Math.min(96,Math.max(62,W*0.3));
    var mL={t:6,r:58,b:6,l:rotW};
    var pw=W-mL.l-mL.r, ph=H-mL.t-mL.b;
    var max=0; dados.forEach(function(r){max=Math.max(max,r[1],r[2]);});
    max=max||1;
    var grupo=ph/n;
    var alt=Math.max(7,Math.min(15,(grupo-14)/2));
    var svg=el('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':'Faturamento por loja'});
    svg.appendChild(el('line',{class:'eixo',x1:mL.l,x2:mL.l,y1:mL.t,y2:mL.t+ph}));

    function barra(x0,yy,w,h,cor){
      var r=Math.min(4,h/2), ww=Math.max(h/2,w);
      return el('path',{d:'M'+x0+' '+yy+' H'+(x0+ww-r)+' a'+r+' '+r+' 0 0 1 '+r+' '+r+
                          ' v'+(h-2*r)+' a'+r+' '+r+' 0 0 1 '+(-r)+' '+r+' H'+x0+' Z',fill:cor});
    }

    dados.forEach(function(r,i){
      var cy=mL.t+grupo*i+grupo/2;
      var rot=el('text',{class:'rotbarra',x:mL.l-9,y:cy+4,'text-anchor':'end'});
      rot.textContent=r[0]; svg.appendChild(rot);

      [1,2].forEach(function(s,k){
        var v=r[s];
        var yy=cy-alt-1+k*(alt+2);
        if(v<=0){
          var z=el('text',{class:'valbarra',x:mL.l+5,y:yy+alt-2,opacity:.55});
          if(k===0||r[1]<=0) { }
          return;
        }
        var w=(v/max)*pw;
        var b=barra(mL.l,yy,w,alt,css('--s'+(k+1)));
        b.style.cursor='default';
        svg.appendChild(b);
        var lab=el('text',{class:'valbarra',x:mL.l+Math.max(w,alt/2)+6,y:yy+alt-1.5});
        lab.textContent=brl0(v); svg.appendChild(lab);

        var alvo=el('rect',{x:mL.l,y:yy-1,width:Math.max(w,10)+54,height:alt+2,fill:'transparent'});
        alvo.addEventListener('pointerenter',function(){
          tip.innerHTML='<div class="t">'+r[0]+'</div>'+
            '<div class="l"><span><i style="background:var(--s'+(k+1)+')"></i> '+(k?'Mevo':'Mercado Livre')+'</span><b>'+brl(v)+'</b></div>';
          tip.style.opacity=1;
          var tw=tip.offsetWidth;
          tip.style.left=Math.max(2,Math.min(W-tw-2,mL.l+w/2-tw/2))+'px';
          tip.style.top=Math.max(2,yy-tip.offsetHeight-6)+'px';
        });
        alvo.addEventListener('pointerleave',function(){tip.style.opacity=0;});
        svg.appendChild(alvo);
      });
    });
    box.appendChild(svg);
  }

  /* ================= tabela ================= */
  function produtos(d){
    var corpo=document.getElementById('corpoProd');
    var tot=0; d.pr.forEach(function(r){tot+=r[2];});
    var max=d.pr.length?d.pr[0][2]:1;
    corpo.textContent='';
    d.pr.forEach(function(r){
      var nome=(typeof NOMES!=='undefined'&&NOMES[r[0]])||('SKU '+r[0]);
      var tr=document.createElement('tr');
      tr.innerHTML='<td class="sku">'+r[0]+'</td>'+
        '<td class="prod" title="'+nome.replace(/"/g,'&quot;')+'">'+nome+'</td>'+
        '<td class="num">'+r[1]+'</td>'+
        '<td class="num">'+brl(r[2])+'</td>'+
        '<td><span class="barrinha"><i style="width:'+(r[2]/max*100).toFixed(1)+'%"></i></span></td>'+
        '<td class="num">'+pct(tot?r[2]/tot:0)+'</td>';
      corpo.appendChild(tr);
    });
  }

  /* ================= pintar ================= */
  function pintar(){
    var d=DADOS.periodos[atual];
    document.getElementById('sub').textContent=d.rotulo+' · Mercado Livre e Mevo';
    kpis(d); porDia(d); porLoja(d); produtos(d);
  }
  function redesenhar(){
    var d=DADOS.periodos[atual];
    porDia(d); porLoja(d);
  }

  Array.prototype.slice.call(document.querySelectorAll('.chips button')).forEach(function(b){
    b.addEventListener('click',function(){
      atual=b.dataset.p;
      Array.prototype.slice.call(document.querySelectorAll('.chips button')).forEach(function(o){
        o.setAttribute('aria-pressed', o===b ? 'true' : 'false');
      });
      pintar();
    });
    if(!b.hasAttribute('aria-pressed')) b.setAttribute('aria-pressed','false');
  });

  var g=new Date(DADOS.gerado);
  document.getElementById('pe').textContent=
    'Espelho da API da VTEX (OMS), canais MLC e MVF. Dados de '+
    g.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+
    '. Dias no horário de Brasília. A tela não se atualiza sozinha.';

  pintar();

  var t;
  var agendar=function(){clearTimeout(t);t=setTimeout(redesenhar,100);};
  window.addEventListener('resize',agendar);
  if(window.ResizeObserver){
    var ro=new ResizeObserver(agendar);
    ro.observe(document.getElementById('plotDia'));
    ro.observe(document.getElementById('plotLoja'));
  } else {
    requestAnimationFrame(function(){requestAnimationFrame(redesenhar);});
  }
  if(window.matchMedia) try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',redesenhar); }catch(e){}
})();
</script>
</body>
</html>
